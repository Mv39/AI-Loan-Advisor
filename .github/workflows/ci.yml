name: CI
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: API - lint, typecheck, test (incl. MongoDB contract), build
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: server } }
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # 127.0.0.1, not localhost: Node 18+ resolves localhost to IPv6 (::1) first, the service container listens on IPv4
      MONGO_URI_TEST: mongodb://127.0.0.1:27017
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: server/package-lock.json }
      - run: npm ci
      - name: Verify MongoDB is reachable
        run: node -e "require('mongodb').MongoClient.connect(process.env.MONGO_URI_TEST,{serverSelectionTimeoutMS:10000}).then(async c=>{await c.db('admin').command({ping:1});console.log('MongoDB OK');await c.close()}).catch(e=>{console.error(e.message);process.exit(1)})"
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@v4
        with: { name: server-coverage, path: server/coverage }

  client:
    name: Web - lint, test, build
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: client } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: client/package-lock.json }
      - run: npm ci
      - run: npx ng lint
      - run: npm test
      - run: npx ng build
      - run: npm audit --omit=dev --audit-level=high

  e2e:
    name: End-to-end (Playwright)
    needs: [server, client]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm run setup && npm ci --prefix e2e
      - run: npm run build
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npm test
        working-directory: e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: e2e/playwright-report }

  docker:
    name: Docker image builds
    needs: [server, client]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t loan-advisor:ci .
